name: Auto Update CF IPs

on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小时自动运行一次
  workflow_dispatch: # 允许你在网页上随时手动点按钮运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install curl_cffi

    - name: Run script
      run: python main.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/ip.txt
        git commit -m "Update ip.txt" || exit 0
        git push
